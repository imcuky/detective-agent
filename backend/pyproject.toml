[project]
name = "detective-agent"
version = "0.1.0"
description = "Deterministic state machine + multi-agent detective mystery game built with Google GenAI, FastAPI SSE, and React."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
detective-cli = "detective_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detective_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
